[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "true-pixelizer"
version = "0.1.0"
description = "Deterministic image-to-pixel-sprite processor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
]

[project.scripts]
true-pixelizer = "true_pixelizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
